name: Android

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's default includes the retired SDK package named 'tools'.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Prepare verified native sources and Alpine guest
        run: |
          python3 scripts/prepare-native.py
          python3 scripts/prepare-alpine-riscv64.py
      - name: Native build and Alpine shell smoke test
        run: |
          cmake -S native -B out/host -DCMAKE_BUILD_TYPE=Release
          cmake --build out/host -j2
          ctest --test-dir out/host --output-on-failure
          python3 scripts/smoke-boot.py
      - name: Unit tests, debug APK and lint
        run: ./gradlew --no-daemon test assembleDebug assembleDebugAndroidTest lintDebug
