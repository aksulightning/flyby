name: Inspect pinned GPU interfaces
on:
  push:
    branches: ['codex/main']
    paths: ['.github/workflows/gpu-interfaces.yml']
permissions:
  contents: read
jobs:
  interfaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: python3 scripts/prepare-native.py
      - name: Pinned Vulkan and memory interfaces
        shell: python
        run: |
          from pathlib import Path
          root = Path('native/vendor/virglrenderer')
          for name in ['src/venus/meson.build', 'src/virglrenderer.h', 'src/virgl_resource.c', 'src/venus/vkr_device_memory.c', 'src/meson.build']:
              print('\nFILE: '+name, flush=True)
              print((root/name).read_text() if (root/name).exists() else 'MISSING', flush=True)
          print('GENERATED PROTOCOL HEADERS')
          print('\n'.join(str(p) for p in root.rglob('*protocol*')))
