name: Build APK

on:
  push:
    branches: ['codex/main']
    paths-ignore: ['.github/workflows/gpu-interfaces.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile ARM64 APK (no tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Install guest build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu python3-yaml e2fsprogs
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: riscv64
      - name: Prepare native sources and resolve current Alpine guest packages
        run: |
          python3 scripts/prepare-native.py
          python3 scripts/alpine_packages.py
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: venus-cache
        with:
          path: out/venus
          key: riscv64-venus-${{ hashFiles('out/alpine/lock.json', 'scripts/prepare-venus.py') }}
      - name: Build RISC-V Venus from verified source
        if: steps.venus-cache.outputs.cache-hit != 'true'
        run: python3 scripts/prepare-venus.py
      - name: Prepare guest images
        run: python3 scripts/prepare-alpine-riscv64.py
      # assembleDebug builds Kotlin/Java, Android native libraries and the APK.
      # Guest asset integrity checks remain part of packaging; no test or lint tasks run.
      - name: Compile ARM64 debug APK
        run: |
          ./gradlew --no-daemon assembleDebug \
            -PflybyVersionName="0.2.0-build.${GITHUB_RUN_NUMBER}+${GITHUB_SHA:0:7}" \
            -PflybyCommit="$GITHUB_SHA"
      - name: Bundle matching sources for the downloadable APK
        run: python3 scripts/bundle-sources.py
      - name: Stage build artifacts and checksums
        run: |
          mkdir -p out/build
          cp app/build/outputs/apk/debug/app-debug.apk out/build/flyby-arm64-debug.apk
          cp out/release/flyby-corresponding-source.tar.gz out/build/
          cp out/alpine/lock.json out/build/alpine-lock.json
          cp app/src/main/assets/vm/provenance.json out/build/guest-provenance.json
          cd out/build
          sha256sum flyby-arm64-debug.apk flyby-corresponding-source.tar.gz alpine-lock.json guest-provenance.json > SHA256SUMS
      - name: Upload APK, matching sources and package metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flyby-arm64-debug-${{ github.sha }}
          path: out/build/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
